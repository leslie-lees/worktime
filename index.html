<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="打卡记录">
<title>打卡记录</title>
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--text:#1b2233;--sub:#7a8499;--line:#e8ecf3;
  --brand:#2f6bff;--brand-weak:#e8efff;
  --ok:#12a150;--ok-weak:#e3f6ec;
  --warn:#e8590c;--warn-weak:#fdeee3;
  --leave:#8a63d2;--leave-weak:#f0eafb;
  --shadow:0 2px 10px rgba(30,50,90,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f131b;--card:#181e29;--text:#e8ecf4;--sub:#8b95a9;--line:#262e3d;
    --brand:#5b8cff;--brand-weak:#1e2a47;
    --ok:#3ccf7d;--ok-weak:#12301f;
    --warn:#ff8a4c;--warn-weak:#3a2416;
    --leave:#b193ee;--leave-weak:#2a2242;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
header .wrap{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--brand);animation:pulse 1s infinite}
.dot.err{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:16px}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.today .top{display:flex;justify-content:space-between;align-items:baseline}
.today .date{font-size:13px;color:var(--sub)}
.today .big{font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:.5px}
.today .desc{color:var(--sub);font-size:13px;min-height:19px}
.today .times{display:flex;gap:18px;margin-top:10px;font-size:14px}
.today .times b{font-size:17px;font-variant-numeric:tabular-nums}
.today .times span{color:var(--sub);font-size:12px;display:block}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:11px 0;border-radius:12px;font-weight:600;text-align:center}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-weak);color:var(--brand)}
.btn.leave{background:var(--leave-weak);color:var(--leave)}
.btn.danger{background:var(--warn-weak);color:var(--warn)}
.btn:disabled{opacity:.5}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.leave{background:var(--leave-weak);color:var(--leave)}
.badge.doing{background:var(--brand-weak);color:var(--brand)}
.badge.mute{background:var(--line);color:var(--sub)}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthbar .nav{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700}
.monthbar .nav button{width:30px;height:30px;border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
.monthbar .tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.chip{padding:5px 11px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.chip.on{background:var(--brand-weak);color:var(--brand)}

.sum .lab{font-size:13px;color:var(--sub)}
.sum .net{font-size:32px;font-weight:800;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.sum .net.pos{color:var(--ok)}.sum .net.neg{color:var(--warn)}
.sum .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;
  border-top:1px solid var(--line);padding-top:12px}
.sum .grid b{display:block;font-size:17px}
.sum .grid span{font-size:12px;color:var(--sub)}
.sum .all{margin-top:12px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);cursor:pointer;
  border-bottom:1px solid var(--line)}
.row:first-child{border-radius:16px 16px 0 0}.row:last-child{border-radius:0 0 16px 16px;border-bottom:0}
.row:only-child{border-radius:16px}
.list{box-shadow:var(--shadow);border-radius:16px}
.row .d{width:52px;flex:none}
.row .d b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.row .d span{font-size:12px;color:var(--sub)}
.row.today-r .d b{color:var(--brand)}
.row .m{flex:1;min-width:0}
.row .m .t{font-variant-numeric:tabular-nums}
.row .m .s{font-size:12px;color:var(--sub);margin-top:2px}
.row .r{text-align:right;flex:none}
.row .r .df{font-size:13px;margin-top:4px;font-weight:600;font-variant-numeric:tabular-nums}
.row .r .df.pos{color:var(--ok)}.row .r .df.neg{color:var(--warn)}
.row.dim{opacity:.55}
.empty{padding:26px;text-align:center;color:var(--sub);background:var(--card);border-radius:16px}

.mask{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:20;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
  border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);
  transition:transform .25s ease;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:22px;color:var(--sub);width:30px;height:30px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.field input[type=time],.field input[type=date],.field input[type=text],.field input[type=password]{
  width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{padding:10px 12px;border-radius:11px;background:var(--bg);font-size:13px;margin-bottom:12px;min-height:38px}
.preview b{font-size:15px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.imgs .im{position:relative;aspect-ratio:1;border-radius:10px;background:var(--bg);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;text-align:center}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;
  font-size:10px;padding:1px 6px;border-radius:8px}
.imgs .add{border:1.5px dashed var(--line);font-size:26px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.bulk-note{font-size:12px;color:var(--sub);background:var(--bg);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.bulk-progress{height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 14px}
.bulk-progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.bulk-list{display:flex;flex-direction:column;gap:10px}
.bulk-item{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px}
.bulk-item>img{width:74px;height:96px;object-fit:cover;border-radius:8px;background:var(--bg)}
.bulk-item .name{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:7px}
.bulk-entry+.bulk-entry{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.bulk-entry .entry-no{font-size:10px;color:var(--brand);margin-bottom:3px;display:flex;justify-content:space-between}
.bulk-item .fields{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px}
.bulk-item .fields label{font-size:10px;color:var(--sub)}
.bulk-item .fields input{width:100%;min-width:0;margin-top:3px;padding:8px 5px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.bulk-item .state{font-size:13px;color:var(--sub);padding-top:12px}
.bulk-item .state.ok{color:var(--ok)}.bulk-item .state.warn{color:var(--warn)}
.leave-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;
  background:var(--leave-weak);color:var(--leave);font-weight:600;margin-bottom:12px}
.switch{width:46px;height:27px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--leave)}.switch.on::after{left:22px}

.viewer{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
.viewer.show{display:flex}
.viewer .bar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff;align-items:center}
.viewer .bar .ttl{flex:1;font-size:13px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .bar button{padding:7px 13px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-size:14px}
.viewer .bar button.del{color:#ff8a80}
.viewer .body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:6px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .tip{color:#fff;opacity:.6;font-size:12px;text-align:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}

.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(20,26,40,.92);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.setup{font-size:14px}
.setup ol{padding-left:20px;margin:0 0 14px;color:var(--sub);font-size:13px}
.setup a{color:var(--brand)}
.errmsg{color:var(--warn);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>打卡记录</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="sync"><i class="dot" id="dot"></i><span id="syncTxt">未连接</span></div>
    <button class="icon-btn" id="btnSet" aria-label="设置">⚙</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<input type="file" id="bulkFile" accept="image/*" multiple hidden>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="viewer" id="viewer">
  <div class="bar">
    <button id="vClose">关闭</button>
    <div class="ttl" id="vTitle"></div>
    <button id="vDown">下载原图</button>
    <button class="del" id="vDel">删除</button>
  </div>
  <div class="body"><img id="vImg" alt=""></div>
  <div class="tip">iPhone 如果没有直接保存，请长按图片选择「添加到照片」</div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const TARGET = 498;   // 8.3 小时 = 498 分钟
const LUNCH = 60;     // 中午休息 60 分钟
const DATA_PATH = 'data/records.json';
const WD = ['周日','周一','周二','周三','周四','周五','周六'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const tm = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const hm = m => `${p2(Math.floor(m/60)%24)}:${p2(m%60)}`;
const dur = m => {
  m = Math.abs(Math.round(m));
  const h = Math.floor(m/60), r = m%60;
  return h ? `${h}小时${p2(r)}分` : `${r}分钟`;
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

let cfg = store.get('wt_cfg', null);           // {token, repo}
let records = store.get('wt_records', {});     // {date: {in,out,leave,imgs:[]}}
let viewMonth = ymd(new Date()).slice(0,7);
let showWeekend = store.get('wt_weekend', false);
let editing = null;
let viewing = null;
let bulkImport = null;
const blobCache = new Map();

/* ---------- GitHub API ---------- */
class ApiError extends Error{ constructor(status,msg){ super(msg); this.status = status; } }

async function api(path, opts = {}, raw = false){
  const res = await fetch(`https://api.github.com/repos/${cfg.repo}${path}`, {
    cache: 'no-store',
    ...opts,
    headers: {
      Authorization: `Bearer ${cfg.token}`,
      Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
      ...(opts.body ? {'Content-Type':'application/json'} : {}),
      ...(opts.headers || {})
    }
  });
  if(!res.ok){
    let msg = res.statusText;
    try{ msg = (await res.json()).message || msg; }catch{}
    throw new ApiError(res.status, msg);
  }
  return raw ? res.blob() : (res.status === 204 ? null : res.json());
}

const utf8ToB64 = str => bytesToB64(new TextEncoder().encode(str));
function bytesToB64(bytes){
  let s = '';
  for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(s);
}
const b64ToUtf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c => c.charCodeAt(0)));
const blobToB64 = blob => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => no(r.error);
  r.readAsDataURL(blob);
});

async function fetchRemote(){
  try{
    const j = await api(`/contents/${DATA_PATH}`);
    const data = JSON.parse(b64ToUtf8(j.content));
    return {records: data.records || {}, sha: j.sha};
  }catch(e){
    if(e.status === 404) return {records: {}, sha: null};
    throw e;
  }
}

async function commitRecords(mutator, message){
  setSync('busy', '同步中…');
  try{
    for(let i=0;i<4;i++){
      const remote = await fetchRemote();
      mutator(remote.records);
      const body = {
        message,
        content: utf8ToB64(JSON.stringify({version:1, records: remote.records}, null, 1))
      };
      if(remote.sha) body.sha = remote.sha;
      try{
        await api(`/contents/${DATA_PATH}`, {method:'PUT', body: JSON.stringify(body)});
        records = remote.records;
        store.set('wt_records', records);
        setSync('ok', '已同步到云端');
        return;
      }catch(e){
        if((e.status === 409 || e.status === 422) && i < 3) continue;
        throw e;
      }
    }
  }catch(e){
    setSync('err', '同步失败');
    throw e;
  }
}

const STALL_MS = 20000; // 上传中超过这么久没有任何进度，判定为卡住并中止

function xhrPutContent(path, content, message, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', `https://api.github.com/repos/${cfg.repo}/contents/${path}`);
    xhr.setRequestHeader('Authorization', `Bearer ${cfg.token}`);
    xhr.setRequestHeader('Accept', 'application/vnd.github+json');
    xhr.setRequestHeader('Content-Type', 'application/json');
    let stallTimer, stalled = false;
    const resetStall = () => {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => { stalled = true; xhr.abort(); }, STALL_MS);
    };
    xhr.upload.onloadstart = resetStall;
    xhr.upload.onprogress = ev => {
      resetStall();
      if(ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
    };
    xhr.onload = () => {
      clearTimeout(stallTimer);
      if(xhr.status >= 200 && xhr.status < 300){ try{ resolve(JSON.parse(xhr.responseText)); }catch{ resolve(null); } }
      else{
        let msg = xhr.statusText || `HTTP ${xhr.status}`;
        try{ msg = JSON.parse(xhr.responseText).message || msg; }catch{}
        reject(new ApiError(xhr.status, msg));
      }
    };
    xhr.onerror = () => { clearTimeout(stallTimer); reject(new Error('网络异常，上传失败')); };
    xhr.onabort = () => { clearTimeout(stallTimer); reject(new Error(stalled ? '网络太慢，上传卡住已中止，请重试' : '上传已取消')); };
    resetStall();
    xhr.send(JSON.stringify({message, content}));
  });
}

async function putFile(path, blob, message, onProgress){
  const content = await blobToB64(blob);
  await xhrPutContent(path, content, message, onProgress);
}
async function deleteFile(path){
  try{
    const meta = await api(`/contents/${path}`);
    await api(`/contents/${path}`, {method:'DELETE', body: JSON.stringify({message:`delete ${path}`, sha: meta.sha})});
  }catch{}
}
function deleteImageIfUnused(img){
  const stillUsed = Object.values(records).some(r => (r.imgs || []).some(i => i.path === img.path));
  if(!stillUsed){ deleteFile(img.path); if(img.thumb) deleteFile(img.thumb); }
}

/* ---------- 截图自动识别打卡时间（OCR，尽力而为，识别后仍可手动修改） ---------- */
let tesseractLoad;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoad) return tesseractLoad;
  const urls = [
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
  ];
  tesseractLoad = new Promise((resolve, reject) => {
    const load = i => {
      if(i >= urls.length){ reject(new Error('OCR 库加载失败')); return; }
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = () => window.Tesseract ? resolve(window.Tesseract) : load(i + 1);
      s.onerror = () => { s.remove(); load(i + 1); };
      document.head.appendChild(s);
    };
    load(0);
  }).catch(err => { tesseractLoad = null; throw err; });
  return tesseractLoad;
}

let ocrWorkerLoad;
function getOcrWorker(){
  if(!ocrWorkerLoad){
    ocrWorkerLoad = loadTesseract().then(async Tesseract => {
      const worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789:：.;/-',
        tessedit_pageseg_mode: '11', // sparse text：打卡截图里的时间通常散落在不同卡片中
        preserve_interword_spaces: '1'
      });
      return worker;
    }).catch(err => { ocrWorkerLoad = null; throw err; });
  }
  return ocrWorkerLoad;
}

const OCR_MAX_SIDE = 1800;
const normalizeOcrTime = raw => {
  const s = String(raw || '').replace(/[Oo]/g, '0').replace(/[Il|]/g, '1');
  const m = s.match(/(?:^|\D)([01]?\d|2[0-3])\s*[:：.;]\s*([0-5]\d)(?!\d)/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : null;
};

const extractOcrTimes = raw => {
  const s = String(raw || '').replace(/[Oo]/g, '0').replace(/[Il|]/g, '1');
  const out = [];
  const re = /(?:^|\D)([01]?\d|2[0-3])\s*[:：.;]\s*([0-5]\d)(?!\d)/g;
  for(const m of s.matchAll(re)) out.push(`${m[1].padStart(2,'0')}:${m[2]}`);
  return out;
};

const extractOcrDates = raw => {
  const s = String(raw || '').replace(/[Oo]/g, '0').replace(/[Il|]/g, '1');
  const out = [];
  const re = /(?:^|\D)(20\d{2})\s*(?:年|[-/.]|\s+)\s*(\d{1,2})\s*(?:月|[-/.]|\s+)\s*(\d{1,2})\s*日?/g;
  for(const m of s.matchAll(re)){
    const y = +m[1], mon = +m[2], day = +m[3];
    const d = new Date(y, mon - 1, day);
    if(d.getFullYear() === y && d.getMonth() === mon - 1 && d.getDate() === day)
      out.push(`${y}-${p2(mon)}-${p2(day)}`);
  }
  return out;
};

const normalizeOcrDate = raw => extractOcrDates(raw)[0] || null;

async function decodeOcrImage(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch{}
  }
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    if(img.decode) await img.decode();
    else await new Promise((ok, no) => { img.onload = ok; img.onerror = no; });
    return img;
  }catch(err){
    URL.revokeObjectURL(url);
    throw err;
  }
}

// 同一张画布左侧保留原图，右侧把近白色像素转成黑色、其他像素转成白色。
// 后者专门处理“橙色圆形按钮里的白色时间”，一次 OCR 即可兼顾普通黑字和反白字。
async function makeOcrCanvas(file){
  const bmp = await decodeOcrImage(file);
  const iw = bmp.width || bmp.naturalWidth, ih = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, OCR_MAX_SIDE / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw * scale));
  const h = Math.max(1, Math.round(ih * scale));
  const src = document.createElement('canvas');
  src.width = w; src.height = h;
  const sx = src.getContext('2d', {willReadFrequently:true});
  sx.drawImage(bmp, 0, 0, w, h);
  if(bmp.close) bmp.close();
  else if(bmp.src?.startsWith('blob:')) URL.revokeObjectURL(bmp.src);

  const out = document.createElement('canvas');
  out.width = w * 2; out.height = h;
  const ox = out.getContext('2d');
  ox.drawImage(src, 0, 0);
  const img = sx.getImageData(0, 0, w, h), px = img.data;
  for(let i = 0; i < px.length; i += 4){
    const light = px[i] * .299 + px[i+1] * .587 + px[i+2] * .114;
    const v = light > 215 ? 0 : 255;
    px[i] = px[i+1] = px[i+2] = v;
    px[i+3] = 255;
  }
  sx.putImageData(img, 0, 0);
  ox.drawImage(src, w, 0);
  return {canvas: out, originalWidth: w, height: h};
}

function collectOcrCandidates(data, originalWidth, imageHeight){
  const out = [];
  const add = (text, bbox, confidence = 0) => {
    const t = normalizeOcrTime(text);
    if(!t) return;
    const b = bbox || {};
    const x0 = Number(b.x0 || 0), x1 = Number(b.x1 || 0);
    const y0 = Number(b.y0 || 0), y1 = Number(b.y1 || 0);
    const h = Math.max(0, y1 - y0);
    // 状态栏里的系统时间通常位于最顶部，只有找不到其他候选时才参与选择。
    const statusBar = imageHeight && y1 < imageHeight * .08;
    out.push({time:t, h, confidence:Number(confidence || 0), statusBar,
      variant: x0 >= originalWidth ? 'light-text' : 'original'});
  };

  for(const w of (data.words || [])) add(w.text, w.bbox, w.confidence);
  // 某些 Tesseract.js 版本不再直接返回 data.words，改为 blocks 嵌套结构。
  for(const block of (data.blocks || []))
    for(const para of (block.paragraphs || []))
      for(const line of (para.lines || [])){
        add(line.text, line.bbox, line.confidence);
        for(const w of (line.words || [])) add(w.text, w.bbox, w.confidence);
      }
  if(!out.length){
    const re = /([01]?\d|2[0-3])\s*[:：.;]\s*([0-5]\d)/g;
    for(const m of String(data.text || '').matchAll(re)) add(m[0], null, 0);
  }

  const unique = new Map();
  for(const c of out){
    const prev = unique.get(c.time);
    const score = c.h * 10 + c.confidence - (c.statusBar ? 10000 : 0);
    const prevScore = prev ? prev.h * 10 + prev.confidence - (prev.statusBar ? 10000 : 0) : -Infinity;
    if(score > prevScore) unique.set(c.time, c);
  }
  return [...unique.values()].sort((a, b) =>
    (b.statusBar ? 0 : 1) - (a.statusBar ? 0 : 1) || b.h - a.h || b.confidence - a.confidence);
}

function collectOcrDate(data){
  const texts = [data.text || ''];
  for(const w of (data.words || [])) texts.push(w.text || '');
  for(const block of (data.blocks || []))
    for(const para of (block.paragraphs || []))
      for(const line of (para.lines || [])) texts.push(line.text || '');
  for(const text of texts){
    const date = normalizeOcrDate(text);
    if(date) return date;
  }
  return null;
}

function timesToFields(times){
  const unique = [...new Set(times)].sort((a,b) => tm(a) - tm(b));
  if(!unique.length) return {in:'', out:''};
  if(unique.length === 1) return tm(unique[0]) < 12*60 ? {in:unique[0], out:''} : {in:'', out:unique[0]};
  return {in:unique[0], out:unique[unique.length - 1]};
}

// 从 OCR 行的坐标关系中，把每个时间归到离它最近的日期区段。
// 左右两半分别是原图和反白增强图，最后按日期合并两边的结果。
function collectAttendanceEntries(data, originalWidth, imageHeight){
  const lines = [];
  for(const block of (data.blocks || []))
    for(const para of (block.paragraphs || []))
      for(const line of (para.lines || [])) lines.push(line);
  if(!lines.length) for(const w of (data.words || [])) lines.push(w);

  const anchors = [], timeMarks = [];
  for(const line of lines){
    const b = line.bbox || {}, x0 = Number(b.x0 || 0), x1 = Number(b.x1 || 0);
    const y0 = Number(b.y0 || 0), y1 = Number(b.y1 || 0), y = (y0 + y1) / 2;
    const variant = (x0 + x1) / 2 >= originalWidth ? 'light-text' : 'original';
    for(const date of extractOcrDates(line.text || '')) anchors.push({date, y, variant});
    if(!(imageHeight && y1 < imageHeight * .08))
      for(const time of extractOcrTimes(line.text || '')) timeMarks.push({time, y, variant});
    // 行文本可能被 OCR 拆坏；单词级结果作为补充。
    for(const w of (line.words || [])){
      const wb = w.bbox || {}, wy = (Number(wb.y0 || 0) + Number(wb.y1 || 0)) / 2;
      if(!(imageHeight && Number(wb.y1 || 0) < imageHeight * .08))
        for(const time of extractOcrTimes(w.text || '')) timeMarks.push({time, y:wy, variant});
    }
  }

  const gathered = new Map();
  for(const variant of ['original','light-text']){
    const ds = anchors.filter(a => a.variant === variant && a.y > 0).sort((a,b) => a.y - b.y);
    const ts = timeMarks.filter(t => t.variant === variant && t.y > 0);
    for(let i = 0; i < ds.length; i++){
      const low = i ? (ds[i-1].y + ds[i].y) / 2 : -Infinity;
      const high = i+1 < ds.length ? (ds[i].y + ds[i+1].y) / 2 : Infinity;
      const times = ts.filter(t => t.y >= low && t.y < high).map(t => t.time);
      if(!gathered.has(ds[i].date)) gathered.set(ds[i].date, []);
      gathered.get(ds[i].date).push(...times);
    }
  }

  // 没有可靠坐标时按纯文本里的日期区段兜底。
  if(!gathered.size){
    const text = String(data.text || '');
    const re = /(?:^|\D)(20\d{2})\s*(?:年|[-/.]|\s+)\s*(\d{1,2})\s*(?:月|[-/.]|\s+)\s*(\d{1,2})\s*日?/g;
    const found = [...text.matchAll(re)];
    for(let i = 0; i < found.length; i++){
      const date = normalizeOcrDate(found[i][0]);
      if(!date) continue;
      const section = text.slice(found[i].index + found[i][0].length, found[i+1]?.index ?? text.length);
      if(!gathered.has(date)) gathered.set(date, []);
      gathered.get(date).push(...extractOcrTimes(section));
    }
  }

  return [...gathered].map(([date, times]) => ({date, ...timesToFields(times)})).sort((a,b) => a.date.localeCompare(b.date));
}

// 返回主时间及全部候选。字号最大的非状态栏时间通常就是圆形打卡按钮上的当前时间。
async function ocrTimes(file){
  try{
    const worker = await getOcrWorker();
    const prep = await makeOcrCanvas(file);
    const {data} = await worker.recognize(prep.canvas, {}, {blocks:true, text:true});
    const candidates = collectOcrCandidates(data, prep.originalWidth, prep.height);
    const entries = collectAttendanceEntries(data, prep.originalWidth, prep.height);
    return {date: entries[0]?.date || collectOcrDate(data), primary: candidates[0]?.time || null, candidates, entries};
  }catch(err){
    console.warn('OCR failed', err);
    return {date:null, primary:null, candidates:[], entries:[]};
  }
}

function applyRecognizedTimes(cur, result){
  const primary = result.primary;
  if(!primary || cur.leave) return [];
  const changed = [];
  const minutes = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const all = [...new Set(result.candidates.map(c => c.time))];
  const primaryMin = minutes(primary);

  // 一张下班截图常同时包含当天上班时间：若表单全空，顺便补上最早的上午时间。
  if(!cur.in && !cur.out && primaryMin >= 12*60){
    const morning = all.filter(t => minutes(t) < 12*60).sort((a,b) => minutes(a)-minutes(b))[0];
    if(morning){ cur.in = morning; changed.push(`上班 ${morning}`); }
    cur.out = primary; changed.push(`下班 ${primary}`);
  } else if(!cur.in && primaryMin < 12*60){
    cur.in = primary; changed.push(`上班 ${primary}`);
  } else if(!cur.out && (!cur.in || primaryMin > minutes(cur.in))){
    cur.out = primary; changed.push(`下班 ${primary}`);
  } else if(!cur.in && cur.out && primaryMin < minutes(cur.out)){
    cur.in = primary; changed.push(`上班 ${primary}`);
  }
  return changed;
}

function recognizeStaged(cur, s){
  s.ocrPromise = ocrTimes(s.file).then(result => {
    s.ocr = 'done';
    s.ocrResult = result;
    if(editing !== cur) return;
    if(!result.primary){
      toast('未能从截图中识别到时间，请手动填写');
      if(!cur.saving) renderSheet();
      return;
    }
    if(!cur.saving){
      cur.in = $('#fIn') ? $('#fIn').value : cur.in;
      cur.out = $('#fOut') ? $('#fOut').value : cur.out;
    }
    const changed = applyRecognizedTimes(cur, result);
    toast(changed.length ? `已识别并填入：${changed.join('、')}，请核对` : `识别到 ${result.primary}，现有时间未覆盖`);
    if(!cur.saving) renderSheet();
  });
  return s.ocrPromise;
}

async function makeThumb(file){
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width*s));
    c.height = Math.max(1, Math.round(bmp.height*s));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', .75));
  }catch{ return null; }
}

const MIME = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',heif:'image/heif',bmp:'image/bmp'};
async function loadBlob(path, type){
  if(blobCache.has(path)) return blobCache.get(path);
  const b = await api(`/contents/${path}`, {}, true);
  const ext = path.split('.').pop().toLowerCase();
  const url = URL.createObjectURL(new Blob([b], {type: type || MIME[ext] || 'application/octet-stream'}));
  blobCache.set(path, url);
  return url;
}

/* ---------- 计算 ---------- */
function calc(r){
  if(!r) return {state:'none'};
  if(r.leave) return {state:'leave'};
  if(r.in && r.out){
    const a = tm(r.in), b = tm(r.out);
    if(b <= a) return {state:'bad'};
    const worked = b - a - LUNCH;
    return {state:'done', worked, diff: worked - TARGET};
  }
  if(r.in) return {state:'partial'};
  return {state:'none'};
}

function monthStats(prefix){
  let net = 0, days = 0, reached = 0, leave = 0, worked = 0;
  for(const [d, r] of Object.entries(records)){
    if(prefix && !d.startsWith(prefix)) continue;
    const c = calc(r);
    if(c.state === 'leave') leave++;
    if(c.state === 'done'){ net += c.diff; days++; worked += c.worked; if(c.diff >= 0) reached++; }
  }
  return {net, days, reached, leave, avg: days ? worked/days : 0};
}

const netText = (m, prefix='') => m >= 0 ? `${prefix}超出 ${dur(m)}` : `${prefix}不足 ${dur(m)}`;
const diffShort = m => m >= 0 ? `+${dur(m)}` : `-${dur(m)}`;

/* ---------- 渲染 ---------- */
function setSync(kind, txt){
  $('#dot').className = 'dot' + (kind === 'ok' ? '' : ' ' + kind);
  $('#syncTxt').textContent = txt;
}

function badge(c){
  switch(c.state){
    case 'leave': return '<span class="badge leave">请假</span>';
    case 'done':  return c.diff >= 0 ? '<span class="badge ok">已达到 ✓</span>' : `<span class="badge warn">差 ${dur(c.diff)}</span>`;
    case 'partial': return '<span class="badge doing">进行中</span>';
    case 'bad': return '<span class="badge warn">时间有误</span>';
    default: return '<span class="badge mute">未记录</span>';
  }
}

function renderToday(){
  const now = new Date(), key = ymd(now), r = records[key], c = calc(r);
  let big = '未打卡', desc = '', cls = '';
  if(c.state === 'leave'){ big = '今日请假'; desc = '这一天不计入统计'; }
  else if(c.state === 'done'){
    big = dur(c.worked);
    desc = c.diff >= 0 ? `已达到 8.3 小时，超出 ${dur(c.diff)}` : `距离 8.3 小时还差 ${dur(c.diff)}`;
  } else if(c.state === 'partial'){
    big = '上班中';
    const reach = tm(r.in) + TARGET + LUNCH;
    desc = `预计 ${hm(reach)} 打卡下班即满 8.3 小时`;
  } else if(c.state === 'bad'){ big = '时间有误'; desc = '下班时间需晚于上班时间'; }
  const times = c.state === 'leave' ? '' :
    `<div class="times"><div><span>上班</span><b>${esc(r?.in || '--:--')}</b></div>
     <div><span>下班</span><b>${esc(r?.out || '--:--')}</b></div>
     <div><span>状态</span>${badge(c)}</div></div>`;
  return `<section class="card today">
    <div class="top"><span class="date">今天 · ${key} ${WD[now.getDay()]}</span></div>
    <div class="big">${esc(big)}</div>
    <div class="desc">${esc(desc)}</div>${times}
    <div class="actions">
      <button class="btn primary" data-act="edit" data-date="${key}">${r && (r.in || r.out || r.imgs?.length) ? '编辑打卡' : '记录打卡'}</button>
      <button class="btn leave" data-act="quickLeave" data-date="${key}">${c.state === 'leave' ? '取消请假' : '请假'}</button>
    </div></section>`;
}

function renderSummary(){
  const s = monthStats(viewMonth), all = monthStats('');
  const [y, m] = viewMonth.split('-');
  return `<section class="card sum">
    <div class="lab">${+m}月累计</div>
    <div class="net ${s.net >= 0 ? 'pos' : 'neg'}">${s.days ? netText(s.net) : '暂无数据'}</div>
    <div class="grid">
      <div><b>${s.days}</b><span>出勤天数</span></div>
      <div><b>${s.reached}</b><span>达到 8.3h</span></div>
      <div><b>${s.leave}</b><span>请假</span></div>
      <div><b>${s.days ? (s.avg/60).toFixed(2) : '-'}</b><span>日均(时)</span></div>
    </div>
    <div class="all">全部累计：${all.days ? netText(all.net) : '暂无'} · 共 ${all.days} 天</div>
  </section>`;
}

function monthDays(){
  const [y, m] = viewMonth.split('-').map(Number);
  const today = ymd(new Date());
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for(let d = last; d >= 1; d--){
    const key = `${y}-${p2(m)}-${p2(d)}`;
    if(key > today) continue;
    const dow = parseYmd(key).getDay();
    const weekend = dow === 0 || dow === 6;
    const has = records[key] && (records[key].in || records[key].out || records[key].leave || records[key].imgs?.length);
    if(weekend && !showWeekend && !has) continue;
    out.push({key, dow, weekend, has});
  }
  return out;
}

function renderList(){
  const days = monthDays();
  if(!days.length) return '<div class="empty">这个月还没有可记录的日子</div>';
  const today = ymd(new Date());
  return '<ul class="list">' + days.map(({key, dow, weekend}) => {
    const r = records[key], c = calc(r);
    let mid = '<div class="t" style="color:var(--sub)">—</div>', sub = '';
    if(c.state === 'leave') mid = '<div class="t">请假</div>';
    else if(r && (r.in || r.out)) mid = `<div class="t">${esc(r.in || '--:--')} – ${esc(r.out || '--:--')}</div>`;
    if(c.state === 'done') sub = `<div class="s">工作 ${dur(c.worked)}</div>`;
    const n = r?.imgs?.length || 0;
    if(n) sub += `<div class="s">📎 ${n} 张截图</div>`;
    const df = c.state === 'done' ? `<div class="df ${c.diff >= 0 ? 'pos' : 'neg'}">${diffShort(c.diff)}</div>` : '';
    return `<li class="row ${key === today ? 'today-r' : ''} ${weekend && c.state === 'none' ? 'dim' : ''}" data-act="edit" data-date="${key}">
      <div class="d"><b>${key.slice(5)}</b><span>${WD[dow]}</span></div>
      <div class="m">${mid}${sub}</div>
      <div class="r">${badge(c)}${df}</div></li>`;
  }).join('') + '</ul>';
}

function render(){
  if(!cfg){ openSetup(true); return; }
  const [y, m] = viewMonth.split('-');
  $('#app').innerHTML = renderToday() + `
    <div class="monthbar">
      <div class="nav"><button data-act="prev">‹</button><span>${y}年${+m}月</span><button data-act="next">›</button></div>
      <div class="tools">
        <button class="chip ${showWeekend ? 'on' : ''}" data-act="weekend">周末</button>
        <button class="chip" data-act="bulkPick">批量导入</button>
        <button class="chip" data-act="edit" data-date="${ymd(new Date())}" data-pick="1">补记</button>
      </div>
    </div>` + renderSummary() + renderList();
}

/* ---------- 编辑面板 ---------- */
function openSheet(){ $('#mask').classList.add('show'); $('#sheet').classList.add('show'); }
function closeSheet(){
  if(bulkImport?.saving){ toast('正在保存，请稍候'); return; }
  $('#mask').classList.remove('show'); $('#sheet').classList.remove('show');
  if(editing){ editing.staged.forEach(s => URL.revokeObjectURL(s.url)); }
  if(bulkImport){ bulkImport.items.forEach(i => URL.revokeObjectURL(i.url)); }
  editing = null;
  bulkImport = null;
}

function startEdit(date){
  const r = records[date] || {};
  if(editing) editing.staged.forEach(s => URL.revokeObjectURL(s.url));
  editing = {
    date, in: r.in || '', out: r.out || '', leave: !!r.leave,
    imgs: (r.imgs || []).map(i => ({...i})), staged: [], removed: new Set(), mode: 'sheet'
  };
  renderSheet();
  openSheet();
}

function previewLine(){
  const c = calc({in: editing.in, out: editing.out, leave: editing.leave});
  if(c.state === 'leave') return '请假，这一天不计入统计';
  if(c.state === 'done'){
    const a = tm(editing.in), b = tm(editing.out);
    return `${editing.in} – ${editing.out}，扣除午休 1 小时<br>工作时长 <b>${dur(c.worked)}</b> · ` +
      (c.diff >= 0 ? `<span style="color:var(--ok)">已达到 8.3h，超出 ${dur(c.diff)}</span>` : `<span style="color:var(--warn)">不足 ${dur(c.diff)}</span>`);
  }
  if(c.state === 'bad') return '<span style="color:var(--warn)">下班时间需晚于上班时间</span>';
  if(c.state === 'partial') return `预计 ${hm(tm(editing.in) + TARGET + LUNCH)} 下班即满 8.3 小时`;
  return '填写上班和下班时间后自动计算';
}

function renderSheet(){
  const e = editing;
  const d = parseYmd(e.date);
  const shown = e.imgs.filter(i => !e.removed.has(i.path));
  $('#sheetIn').innerHTML = `
    <h2><span>${e.date} ${WD[d.getDay()]}</span><button data-act="closeSheet" aria-label="关闭">×</button></h2>
    <div class="field"><label>日期</label><input type="date" id="fDate" value="${e.date}" max="${ymd(new Date())}"></div>
    <div class="leave-toggle" data-act="toggleLeave"><span>今天请假（不计入统计）</span><i class="switch ${e.leave ? 'on' : ''}"></i></div>
    <div class="two" style="${e.leave ? 'opacity:.4;pointer-events:none' : ''}">
      <div class="field"><label>上班打卡</label><input type="time" id="fIn" value="${esc(e.in)}"></div>
      <div class="field"><label>下班打卡</label><input type="time" id="fOut" value="${esc(e.out)}"></div>
    </div>
    <div class="preview" id="prev">${previewLine()}</div>
    <div class="field"><label>打卡截图（原图上传，会尝试自动识别时间，识别可能不准，请务必核对）</label>
      <div class="imgs" id="imgs">
        ${shown.map(i => `<div class="im" data-act="view" data-path="${esc(i.path)}"><img data-thumb="${esc(i.thumb || '')}" data-type="${esc(i.type || '')}" alt=""><span class="ph">加载中</span></div>`).join('')}
        ${e.staged.map((s, k) => `<div class="im" data-act="unstage" data-k="${k}"><img src="${s.url}" alt=""><span class="tag">${s.ocr === 'pending' ? '识别中…' : '待上传 ✕'}</span></div>`).join('')}
        <div class="im add" data-act="pick">＋</div>
      </div>
      <input type="file" id="fFile" accept="image/*" multiple hidden>
    </div>
    <div class="actions">
      ${(records[e.date]) ? '<button class="btn danger" data-act="clearDay" style="flex:.5">清除</button>' : ''}
      <button class="btn primary" data-act="save" id="btnSave">保存</button>
    </div>`;
  hydrateThumbs();
}

async function hydrateThumbs(){
  for(const img of document.querySelectorAll('#imgs img[data-thumb]')){
    const p = img.dataset.thumb;
    const ph = img.nextElementSibling;
    if(!p){ if(ph) ph.textContent = '点击查看'; img.remove(); continue; }
    try{
      img.src = await loadBlob(p, 'image/jpeg');
      ph?.remove();
    }catch{ if(ph) ph.textContent = '加载失败'; img.remove(); }
  }
}

function refreshPreview(){
  const pv = $('#prev'); if(pv) pv.innerHTML = previewLine();
}

function syncBulkInputs(){
  if(!bulkImport || bulkImport.running) return;
  for(const input of document.querySelectorAll('[data-bulk-field]')){
    const item = bulkImport.items[+input.dataset.k];
    const entry = item?.entries[+input.dataset.j];
    if(entry) entry[input.dataset.bulkField] = input.value;
  }
}

function renderBulkSheet(){
  const b = bulkImport;
  if(!b) return;
  const done = b.items.filter(i => i.status !== 'pending').length;
  const rows = b.items.map((item, k) => {
    if(b.running){
      const msg = item.status === 'pending' ? (k === done ? '正在识别日期和时间…' : '等待识别') :
        item.entries.some(x => x.date) ? `识别到 ${item.entries.filter(x => x.date).length} 天记录` : '未识别到日期，稍后可手动填写';
      return `<div class="bulk-item"><img src="${item.url}" alt=""><div><div class="name">${esc(item.file.name)}</div><div class="state ${item.status === 'done' ? (item.entries.some(x => x.date) ? 'ok' : 'warn') : ''}">${msg}</div></div></div>`;
    }
    const entries = item.entries.map((entry, j) => `<div class="bulk-entry">
      ${item.entries.length > 1 ? `<div class="entry-no"><span>第 ${j+1} 天</span><button data-act="bulkRemoveEntry" data-k="${k}" data-j="${j}">删除此天</button></div>` : ''}
      <div class="fields">
        <label>日期<input type="date" data-bulk-field="date" data-k="${k}" data-j="${j}" value="${esc(entry.date)}" max="${ymd(new Date())}"></label>
        <label>上班<input type="time" data-bulk-field="in" data-k="${k}" data-j="${j}" value="${esc(entry.in)}"></label>
        <label>下班<input type="time" data-bulk-field="out" data-k="${k}" data-j="${j}" value="${esc(entry.out)}"></label>
      </div></div>`).join('');
    return `<div class="bulk-item"><img src="${item.url}" alt=""><div>
      <div class="name">${esc(item.file.name)}</div>
      ${entries}
      <button class="hint" data-act="bulkAddEntry" data-k="${k}" style="color:var(--brand);padding:6px 8px 6px 0">＋ 添加一天</button>
      <button class="hint" data-act="bulkRemove" data-k="${k}" style="color:var(--warn);padding:6px 0">移除这张</button>
    </div></div>`;
  }).join('');
  $('#sheetIn').innerHTML = `
    <h2><span>批量导入 ${b.items.length} 张</span><button data-act="closeSheet" aria-label="关闭">×</button></h2>
    <div class="bulk-note">${b.running ? '正在逐张识别并拆分其中的多天记录，请保持页面打开。首次使用需下载 OCR 模型，可能稍慢。' : '一张截图可展开为多天，请逐条核对日期和时间。相同日期会自动合并，已有的手工时间不会被覆盖。'}</div>
    ${b.running ? `<div class="bulk-progress"><i style="width:${b.items.length ? done/b.items.length*100 : 0}%"></i></div>` : ''}
    <div class="bulk-list">${rows}</div>
    ${b.running ? '' : `<div class="actions"><button class="btn ghost" data-act="bulkAdd">继续添加</button><button class="btn primary" data-act="bulkSave" id="btnBulkSave">确认保存</button></div>`}`;
}

async function startBulkImport(files, append = false){
  if(!files.length) return;
  let job = bulkImport;
  if(!append || !job){
    if(editing) editing.staged.forEach(s => URL.revokeObjectURL(s.url));
    editing = null;
    if(job) job.items.forEach(i => URL.revokeObjectURL(i.url));
    job = bulkImport = {items:[], running:true, saving:false};
    openSheet();
  } else {
    syncBulkInputs();
    job.running = true;
  }
  const added = files.map(file => ({file, url:URL.createObjectURL(file), status:'pending', entries:[]}));
  job.items.push(...added);
  renderBulkSheet();
  for(const item of added){
    const result = await ocrTimes(item.file);
    if(bulkImport !== job) return;
    item.result = result;
    item.entries = (result.entries || []).map(x => ({date:x.date || '', in:x.in || '', out:x.out || ''}));
    if(!item.entries.length) item.entries.push({date:result.date || '', in:'', out:''});
    if(item.entries.length === 1 && !item.entries[0].in && !item.entries[0].out){
      const detected = {in:'', out:'', leave:false};
      applyRecognizedTimes(detected, result);
      item.entries[0].in = detected.in; item.entries[0].out = detected.out;
    }
    item.status = 'done';
    renderBulkSheet();
  }
  if(bulkImport !== job) return;
  job.running = false;
  renderBulkSheet();
  const allEntries = job.items.flatMap(i => i.entries);
  const missing = allEntries.filter(i => !i.date).length;
  toast(missing ? `识别完成，${missing} 条未识别到日期，请手动补充` : `已从 ${job.items.length} 张图识别 ${allEntries.length} 天，请核对`);
}

async function commitBulkRecords(uploaded){
  const groups = new Map();
  for(const {item, meta} of uploaded){
    for(const entry of item.entries){
      let g = groups.get(entry.date);
      if(!g) groups.set(entry.date, g = {in:'', out:'', imgs:[]});
      if(entry.in && (!g.in || tm(entry.in) < tm(g.in))) g.in = entry.in;
      if(entry.out && (!g.out || tm(entry.out) > tm(g.out))) g.out = entry.out;
      if(!g.imgs.some(i => i.path === meta.path)) g.imgs.push(meta);
    }
  }
  await commitRecords(rs => {
    for(const [date, g] of groups){
      const cur = rs[date] || {};
      rs[date] = {
        in: cur.in || g.in,
        out: cur.out || g.out,
        leave: !!cur.leave,
        imgs: (cur.imgs || []).concat(g.imgs)
      };
    }
  }, `bulk import ${groups.size} days`);
}

async function saveBulkImport(){
  const job = bulkImport;
  if(!job || job.running || job.saving) return;
  syncBulkInputs();
  if(!job.items.length){ closeSheet(); return; }
  const entries = job.items.flatMap(i => i.entries);
  const invalid = entries.find(i => !/^20\d{2}-\d{2}-\d{2}$/.test(i.date));
  if(invalid){ toast('请先为每条记录填写正确日期'); return; }
  const badTime = entries.find(i => i.in && i.out && tm(i.out) <= tm(i.in));
  if(badTime){ toast(`${badTime.date} 的下班时间需晚于上班时间`); return; }
  job.saving = true;
  const uploaded = [];
  let btn = $('#btnBulkSave');
  btn.disabled = true;
  try{
    for(let k = 0; k < job.items.length; k++){
      const item = job.items[k], f = item.file;
      const ts = Date.now() + k;
      const ext = ((f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '')) || (f.type.split('/')[1] || 'jpg');
      const path = `images/bulk/${ts}.${ext}`;
      const label = `上传 ${k+1}/${job.items.length}`;
      btn.textContent = label + ' · 0%';
      await putFile(path, f, `upload ${path}`, frac => { btn.textContent = `${label} · ${Math.round(frac*100)}%`; });
      const meta = {path, name:f.name || `${ts}.${ext}`, size:f.size, type:f.type || MIME[ext] || '', ts, shared:true};
      const th = await makeThumb(f);
      if(th){
        try{ await putFile(meta.thumb = `thumbs/bulk/${ts}.jpg`, th, `thumb ${meta.thumb}`); }
        catch{ delete meta.thumb; }
      }
      uploaded.push({item, meta});
    }
    btn.textContent = '保存记录中…';
    await commitBulkRecords(uploaded);
    job.saving = false;
    closeSheet(); render(); toast(`已导入 ${entries.length} 天记录（${uploaded.length} 张截图）`);
  }catch(err){
    for(const {meta} of uploaded){ deleteFile(meta.path); if(meta.thumb) deleteFile(meta.thumb); }
    job.saving = false;
    btn = $('#btnBulkSave');
    if(btn){ btn.disabled = false; btn.textContent = '重新保存'; }
    toast('批量保存失败：' + err.message);
  }
}

async function commitImageMetas(oldDate, newDate, metas, removed, timeFields){
  await commitRecords(rs => {
    const cur = rs[oldDate] || {};
    const keep = (cur.imgs || []).filter(i => !removed.has(i.path));
    const tf = timeFields || {in: cur.in || '', out: cur.out || '', leave: !!cur.leave};
    const rec = {in: tf.in, out: tf.out, leave: tf.leave, imgs: keep.concat(metas)};
    if(newDate !== oldDate && rs[oldDate]) delete rs[oldDate];
    const prev = rs[newDate];
    if(newDate !== oldDate && prev) rec.imgs = (prev.imgs || []).concat(rec.imgs);
    if(rec.in || rec.out || rec.leave || rec.imgs.length) rs[newDate] = rec; else delete rs[newDate];
  }, `record ${newDate}`);
}

async function saveEditing(){
  const e = editing;
  e.in = $('#fIn').value; e.out = $('#fOut').value;
  const newDate = $('#fDate').value || e.date;
  const oldDate = e.date, removed = e.removed;
  e.saving = true;
  let btn = $('#btnSave');
  btn.disabled = true;
  const metas = [];
  try{
    const pendingOcr = e.staged.map(s => s.ocrPromise).filter(Boolean);
    if(pendingOcr.length){
      btn.textContent = '识别图片中…';
      await Promise.all(pendingOcr);
      if(editing !== e) return;
    }
    for(let k = 0; k < e.staged.length; k++){
      const f = e.staged[k].file;
      const ts = Date.now() + k;
      const ext = ((f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '')) || (f.type.split('/')[1] || 'jpg');
      const path = `images/${newDate}/${ts}.${ext}`;
      const label = () => `上传中 ${k+1}/${e.staged.length}`;
      btn.textContent = label() + ' · 0%';
      try{
        await putFile(path, f, `upload ${path}`, frac => { btn.textContent = `${label()} · ${Math.round(frac*100)}%`; });
      }catch(upErr){
        throw new Error(`第 ${k+1} 张截图上传失败（${upErr.message}）`);
      }
      const meta = {path, name: f.name || `${ts}.${ext}`, size: f.size, type: f.type || MIME[ext] || '', ts};
      const th = await makeThumb(f);
      if(th){
        try{ await putFile(meta.thumb = `thumbs/${newDate}/${ts}.jpg`, th, `thumb ${meta.thumb}`); }
        catch{ delete meta.thumb; } // 缩略图失败不影响原图，查看时会直接用原图兜底
      }
      metas.push(meta);
    }
    btn.textContent = '保存中…';
    await commitImageMetas(oldDate, newDate, metas, removed, {in: e.in, out: e.out, leave: e.leave});
    for(const i of e.imgs) if(removed.has(i.path)) deleteImageIfUnused(i);
    closeSheet(); render(); toast('已保存并同步到云端');
  }catch(err){
    if(metas.length){
      try{
        await commitImageMetas(oldDate, oldDate, metas, removed);
        const done = metas.length;
        e.staged.splice(0, done).forEach(s => URL.revokeObjectURL(s.url));
        e.imgs = e.imgs.filter(i => !removed.has(i.path)).concat(metas);
        e.removed = new Set();
        toast(`已上传 ${done} 张，${err.message}，可重新点保存重试剩余部分`);
      }catch{
        toast('保存失败：' + err.message);
      }
    } else {
      toast('保存失败：' + err.message);
    }
    e.saving = false;
    btn = $('#btnSave');
    if(btn){ btn.disabled = false; btn.textContent = '保存'; }
    if(editing === e) renderSheet();
  }
}

async function quickLeave(date){
  const cur = records[date]?.leave;
  try{
    await commitRecords(rs => {
      const r = rs[date] || {in:'', out:'', imgs:[]};
      r.leave = !cur;
      rs[date] = r;
    }, `${cur ? 'cancel leave' : 'leave'} ${date}`);
    render(); toast(cur ? '已取消请假' : '已标记请假，不计入统计');
  }catch(err){ toast('操作失败：' + err.message); }
}

/* ---------- 图片查看 / 下载 ---------- */
async function openViewer(path){
  const img = editing.imgs.find(i => i.path === path);
  if(!img) return;
  viewing = img;
  $('#vTitle').textContent = img.name || path;
  $('#vImg').removeAttribute('src');
  $('#viewer').classList.add('show');
  try{ $('#vImg').src = await loadBlob(img.path, img.type); }
  catch(err){ toast('图片加载失败：' + err.message); }
}
async function downloadOriginal(){
  if(!viewing) return;
  try{
    const url = await loadBlob(viewing.path, viewing.type);
    const a = document.createElement('a');
    a.href = url; a.download = viewing.name || viewing.path.split('/').pop();
    document.body.appendChild(a); a.click(); a.remove();
    toast('已开始下载原图');
  }catch(err){ toast('下载失败：' + err.message); }
}

/* ---------- 设置 ---------- */
function openSetup(first){
  $('#sheetIn').innerHTML = `<div class="setup">
    <h2><span>${first ? '首次使用：连接云端' : '云端设置'}</span>${first ? '' : '<button data-act="closeSheet">×</button>'}</h2>
    <ol>
      <li>在 GitHub 创建一个 <b>Fine-grained token</b>（<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">点此创建</a>）</li>
      <li>Repository access 选 <b>Only select repositories</b>，只选数据仓库</li>
      <li>Permissions → Repository → <b>Contents: Read and write</b></li>
      <li>把生成的 token 粘贴到下面，仅保存在本机浏览器中</li>
    </ol>
    <div class="field"><label>数据仓库（用户名/仓库名）</label><input type="text" id="sRepo" value="${esc(cfg?.repo || 'leslie-lees/worktime-data')}" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Token</label><input type="password" id="sToken" value="${esc(cfg?.token || '')}" autocomplete="off" placeholder="github_pat_..."></div>
    <div class="errmsg" id="sErr"></div>
    <div class="actions">
      ${cfg ? '<button class="btn danger" data-act="logout" style="flex:.6">退出</button>' : ''}
      <button class="btn primary" data-act="saveCfg">连接</button>
    </div></div>`;
  $('#mask').classList.add('show'); $('#sheet').classList.add('show');
  editing = null;
  if(first) $('#mask').dataset.lock = '1'; else delete $('#mask').dataset.lock;
}

async function saveCfg(){
  const repo = $('#sRepo').value.trim(), token = $('#sToken').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token){ $('#sErr').textContent = '请填写正确的仓库名和 token'; return; }
  const old = cfg; cfg = {repo, token};
  $('#sErr').textContent = '连接中…';
  try{
    await api('');
    const remote = await fetchRemote();
    records = remote.records; store.set('wt_records', records);
    store.set('wt_cfg', cfg);
    delete $('#mask').dataset.lock;
    closeSheet(); setSync('ok', '已同步到云端'); render(); toast('连接成功');
  }catch(err){
    cfg = old;
    $('#sErr').textContent = err.status === 404 ? '找不到仓库，或 token 没有该仓库权限' :
      err.status === 401 ? 'token 无效或已过期' : '连接失败：' + err.message;
  }
}

async function refresh(){
  if(!cfg) return;
  setSync('busy', '同步中…');
  try{
    const remote = await fetchRemote();
    records = remote.records; store.set('wt_records', records);
    setSync('ok', '已同步到云端'); render();
  }catch(err){
    setSync('err', err.status === 401 ? 'token 失效' : '离线（显示本地缓存）');
  }
}

/* ---------- 事件 ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  switch(a){
    case 'edit': startEdit(el.dataset.date); break;
    case 'bulkPick': $('#bulkFile').dataset.append = '0'; $('#bulkFile').click(); break;
    case 'bulkAdd': $('#bulkFile').dataset.append = '1'; $('#bulkFile').click(); break;
    case 'bulkAddEntry': {
      if(!bulkImport || bulkImport.running) break;
      syncBulkInputs();
      bulkImport.items[+el.dataset.k]?.entries.push({date:'', in:'', out:''});
      renderBulkSheet();
      break;
    }
    case 'bulkRemoveEntry': {
      if(!bulkImport || bulkImport.running) break;
      syncBulkInputs();
      const item = bulkImport.items[+el.dataset.k];
      if(item && item.entries.length > 1) item.entries.splice(+el.dataset.j, 1);
      renderBulkSheet();
      break;
    }
    case 'bulkRemove': {
      if(!bulkImport || bulkImport.running) break;
      syncBulkInputs();
      const [item] = bulkImport.items.splice(+el.dataset.k, 1);
      if(item) URL.revokeObjectURL(item.url);
      if(bulkImport.items.length) renderBulkSheet(); else closeSheet();
      break;
    }
    case 'bulkSave': saveBulkImport(); break;
    case 'quickLeave': quickLeave(el.dataset.date); break;
    case 'prev': case 'next': {
      const [y, m] = viewMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + (a === 'next' ? 1 : -1), 1);
      const nm = `${d.getFullYear()}-${p2(d.getMonth()+1)}`;
      if(nm > ymd(new Date()).slice(0,7)) return;
      viewMonth = nm; render(); break;
    }
    case 'weekend': showWeekend = !showWeekend; store.set('wt_weekend', showWeekend); render(); break;
    case 'closeSheet': closeSheet(); break;
    case 'toggleLeave': editing.in = $('#fIn').value; editing.out = $('#fOut').value; editing.leave = !editing.leave; renderSheet(); break;
    case 'pick': $('#fFile').click(); break;
    case 'unstage': { const [s] = editing.staged.splice(+el.dataset.k, 1); URL.revokeObjectURL(s.url); editing.in = $('#fIn').value; editing.out = $('#fOut').value; renderSheet(); break; }
    case 'view': openViewer(el.dataset.path); break;
    case 'save': saveEditing(); break;
    case 'clearDay':
      if(confirm('确定清除这一天的全部记录和截图吗？')){
        const date = editing.date, imgs = editing.imgs;
        commitRecords(rs => { delete rs[date]; }, `clear ${date}`).then(() => {
          imgs.forEach(deleteImageIfUnused);
          closeSheet(); render(); toast('已清除');
        }).catch(err => toast('失败：' + err.message));
      }
      break;
    case 'saveCfg': saveCfg(); break;
    case 'logout':
      if(confirm('退出后本机保存的 token 和缓存会被清除，云端数据不受影响。')){
        store.del('wt_cfg'); store.del('wt_records'); cfg = null; records = {};
        blobCache.clear(); $('#app').innerHTML = ''; setSync('err', '未连接'); openSetup(true);
      }
      break;
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'bulkFile'){
    const files = [...e.target.files];
    const append = e.target.dataset.append === '1';
    e.target.value = '';
    startBulkImport(files, append);
  } else if(e.target.id === 'fFile'){
    const files = [...e.target.files];
    const cur = editing;
    cur.in = $('#fIn').value; cur.out = $('#fOut').value;
    for(const f of files){
      const s = {file: f, url: URL.createObjectURL(f), ocr: 'pending'};
      cur.staged.push(s);
      recognizeStaged(cur, s);
    }
    renderSheet();
  } else if(e.target.id === 'fDate' && editing){
    const nd = e.target.value; if(!nd) return;
    const keep = {in: $('#fIn').value, out: $('#fOut').value};
    if(records[nd]){ startEdit(nd); }
    else { editing.date = nd; editing.in = keep.in; editing.out = keep.out; renderSheet(); }
  }
});
document.addEventListener('input', e => {
  if((e.target.id === 'fIn' || e.target.id === 'fOut') && editing){
    editing.in = $('#fIn').value; editing.out = $('#fOut').value; refreshPreview();
  }
});

$('#mask').addEventListener('click', () => { if(!$('#mask').dataset.lock) closeSheet(); });
$('#btnSet').addEventListener('click', () => openSetup(false));
$('#vClose').addEventListener('click', () => $('#viewer').classList.remove('show'));
$('#vDown').addEventListener('click', downloadOriginal);
$('#vDel').addEventListener('click', () => {
  if(!viewing || !confirm('删除这张截图？点「保存」后才会从云端移除。')) return;
  editing.removed.add(viewing.path);
  $('#viewer').classList.remove('show');
  editing.in = $('#fIn').value; editing.out = $('#fOut').value;
  renderSheet();
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && !editing && !bulkImport) refresh(); });

render();
if(cfg){ setSync('busy', '同步中…'); refresh(); }
})();
</script>
